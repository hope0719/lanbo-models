<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="OpenLux 模型广场：404 个模型的名称与价格。" />
  <title>模型广场 | OpenLux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=404-catalog-3" />
  <link rel="stylesheet" href="logo.css?v=404-catalog-3" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark">◢</span><b>OpenLux</b></a>
    <nav><a href="#">首页</a><a href="#">控制台</a><a class="active" href="#">模型广场</a><a href="#">代理加盟</a><a href="#">API 文档</a></nav>
    <div class="top-actions"><button aria-label="通知">♧<i>99+</i></button><button aria-label="切换主题">☼</button><button aria-label="切换语言">文A</button><a class="login" href="#">登录</a><a class="register" href="#">注册</a></div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <button id="reset" class="reset">↻&nbsp; 重置</button>
      <div id="vendorFilter" class="filter-group"></div>
      <div id="typeFilter" class="filter-group"></div>
      <div id="tagFilter" class="filter-group"></div>
      <div id="billingFilter" class="filter-group"></div>
    </aside>

    <section class="content" aria-label="模型广场">
      <div class="toolbar">
        <label class="search"><span>⌕</span><input id="search" type="search" placeholder="模糊搜索模型名称" autocomplete="off" /></label>
        <span class="divider"></span><span class="rate-label">倍率</span><button class="switch" aria-label="倍率显示"><i></i></button>
        <button class="table-button">表格视图</button><button class="unit-button">M</button>
      </div>
      <div id="resultSummary" class="result-summary"></div>
      <div id="modelGrid" class="model-grid"></div>
      <div id="empty" class="empty" hidden>没有找到匹配的模型</div>
      <nav id="pagination" class="pagination" aria-label="模型分页"></nav>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="models-data.js?v=404-catalog-3"></script>
  <script src="app.js?v=404-catalog-3"></script>
</body>
</html>
