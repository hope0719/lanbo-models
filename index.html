<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenLux 模型广场。" />
    <title>模型广场 | OpenLux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="masthead">
        <a class="brand" href="./" aria-label="OpenLux 模型广场"><span>◈</span> OpenLux</a>
        <p>MODEL CATALOG / 模型广场</p>
      </header>
      <section class="intro">
        <p class="eyebrow"><i></i> COMPLETE MODEL DIRECTORY</p>
        <h1>模型广场</h1>
        <p>来自 OpenLux 公开价格配置的完整模型目录。模型名称保留原始拼写，可一键复制用于 API 调用。</p>
      </section>
      <section class="catalog" aria-label="模型列表">
        <div class="catalog-head"><div><h2>全部模型</h2><p id="modelCount">正在加载模型</p></div><div class="source">STATIC CATALOG</div></div>
        <div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索或粘贴模型名称" autocomplete="off" /></label><button id="sortButton" class="sort">名称排序 A–Z</button></div>
        <div id="vendors" class="vendors" aria-label="厂商筛选"></div>
        <p class="copy-tip">点击卡片右侧的“复制”即可复制完整、原始的模型名称。</p>
        <div id="modelGrid" class="model-grid"></div>
        <div id="empty" class="empty" hidden>没有找到匹配的模型名称。</div>
        <button id="loadMore" class="load-more">加载更多模型 <span>↓</span></button>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="models.js"></script>
    <script src="app.js"></script>
  </body>
</html>
